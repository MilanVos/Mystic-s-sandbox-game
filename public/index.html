<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mystic Sandbox</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="login-screen">
    <canvas id="bg-particles"></canvas>
    <div class="login-box">
      <h1>MYSTIC <span class="neon-text">SANDBOX</span></h1>
      <p class="subtitle">Create, play, and script your own games with Lua</p>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Login</button>
        <button id="tab-register" class="auth-tab">Register</button>
      </div>

      <div id="auth-login-panel" class="auth-panel">
        <input type="text" id="login-username" placeholder="Username..." maxlength="16" autocomplete="off" />
        <input type="password" id="login-password" placeholder="Password..." maxlength="64" autocomplete="off" />
        <button id="login-btn" class="auth-btn">Login</button>
      </div>

      <div id="auth-register-panel" class="auth-panel" style="display:none;">
        <input type="text" id="reg-username" placeholder="Choose a username..." maxlength="16" autocomplete="off" />
        <input type="password" id="reg-password" placeholder="Choose a password..." maxlength="64" autocomplete="off" />
        <input type="password" id="reg-password2" placeholder="Confirm password..." maxlength="64" autocomplete="off" />
        <button id="register-btn" class="auth-btn">Create Account</button>
      </div>

      <div id="login-error"></div>
      <div id="login-info"></div>

      <div class="controls-hint">
        <h3>Controls</h3>
        <div><span class="key">A</span> <span class="key">D</span> Move &nbsp; <span class="key">W</span> / <span class="key">Space</span> Jump</div>
        <div><span class="key">L-Click</span> Use Tool &nbsp; <span class="key">F</span> Creative / Fly</div>
        <div><span class="key">T</span> Chat &nbsp; <span class="key">L</span> Lua Editor</div>
        <div><span class="key">Shift</span> Fly Down (Creative) &nbsp; <span class="key">Esc</span> Close panels</div>
      </div>
    </div>
  </div>

  <div id="game-container" style="display:none;">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div id="top-bar">
        <div id="player-count">Players: 1</div>
        <div id="game-name-display"></div>
        <div id="mode-display">Play</div>
        <div id="fps-display">FPS: 60</div>
      </div>
    </div>

    <div id="chat-container">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Press T to chat..." maxlength="200" autocomplete="off" />
    </div>

    <div id="player-list-panel"></div>

    <div id="crosshair"></div>

    <div id="lua-ui-layer"></div>

    <div id="toolbar" style="display:none;">
      <div id="toolbar-slots"></div>
    </div>

    <div id="team-panel" style="display:none;">
      <h3>Teams</h3>
      <div id="team-list"></div>
    </div>

    <div id="loading-screen">
      <div class="loader"></div>
      <p>Loading world...</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/constants.js"></script>
  <script src="/js/input.js"></script>
  <script src="/js/world.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/lua-editor.js"></script>
  <script src="/js/game-browser.js"></script>
  <script src="/js/network.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
